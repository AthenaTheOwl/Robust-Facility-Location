name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 resolves the newest PuLP the requirements allow; 3.11 matches DEPLOY.md.
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        run: python -m compileall .

      - name: Smoke-test imports
        run: |
          python - <<'PY'
          import core.data
          import core.models
          import core.models_advanced
          import core.simulation
          import core.state
          import core.utils
          import viz.comparison
          import viz.network
          import viz.simulation_plots
          print("Imports OK")
          PY

      - name: Run tests
        run: python -m pytest -q
